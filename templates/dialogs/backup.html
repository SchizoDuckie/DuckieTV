<!-- dialogs/backup.html -->
<button type="button" class="close" ng-click="cancel()">&times;</button>
<header class="search-dialog-header">
  <h2 translate-once>COMMON/autobackup/hdr</h2>
  <a class="search-dialog-actions" ui-sref="settings.tab({tab: 'backup'})" ng-click="cancel()"> <i class="glyphicon glyphicon-cog"></i> <span translate-once>COMMON/settings/lbl</span><span translate-once>COMMON/autobackup/hdr</span></a>
</header>
<p translate-once>COMMON/backup/desc</p>
<div class="buttons">
    <a class="btn btn-success" ng-click="createBackup();">
      <i class="glyphicon glyphicon-floppy-save"></i> <span translate-once>COMMON/create/btn</span>
    </a>
  <a class="btn btn-danger" ng-click="cancel()">
    <i class="glyphicon glyphicon-ban-circle"></i> <span translate-once>COMMON/cancel/btn</span>
  </a>
</div>
