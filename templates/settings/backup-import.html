<!-- settings\backup-import.html -->
 <div ng-controller="BackupCtrl" class="backup-import">
	<h2 style="margin-top: 13px" translate-once>SETTINGS/BACKUP-IMPORT/hdr</h2>

	<div style="position: relative; height: 34px; width: 275px" ng-if="!restoring">
		<button class="btn btn-success" style="width:100%;height:100%" ng-class="{binputhover:inputhover}" translate-once>COMMON/choose-backup-load/btn</button>
		<input file-input="file" on-change="restore(file)" style="position:absolute;opacity:0;width:275px;height:34px;top:0;cursor:pointer" ng-mouseover="inputhover=true" ng-mouseleave="inputhover=false">
	</div>

	<div ng-include="'templates/settings/backup-restore-progress.html'"></div>
</div>
